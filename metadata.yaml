name: astrbot_plugin_ai_mind
display_name: AI 心智 · 情绪与记忆
short_desc: 会波动的情绪 + 长期记忆 + 拟人分段，情绪有 PAD/Plutchik/词汇本体三层支撑
desc: >-
  把「情绪」和「长期记忆」合成一个插件。情绪用 PAD 三维模型持续演化、
  随时间自然衰减，按消息内容做规则化评估，并用傲娇预设注入表达基调；
  识别到自伤轻生信号时强制放下傲娇、进入认真关心模式。
  记忆则是攒批交给模型抽取事实、喜好、经历与约定，按「常驻 + 最近 + 相关」三路检索注入，
  隐私优先：证件号/住址/学校等敏感信息只在本人私聊里出现，绝不进群聊。
  情绪评估用 PAD 三维模型 + Plutchik 情绪轮，并在手写规则之外接入中文情感词汇本体
  （7 大类 21 小类）做兜底 —— 日常表达也能让她有反应；面板上有「理论」页签可查。
  知道「现在跟谁在说话」：专属用户（主人 / 宝宝）会被当成早就认识的人，
  不会出现「你是谁呀」「报上名来」；面板上填 ID 即可，群里还会自动闭嘴不透露关系。
  还能把一条回复按标点拆成几口气、按字数拟人延迟发出去（代码块/表格/引号整块保护），
  人设里写的「最多 1~3 条气泡」就靠它兜底；和语音插件（TTS）也做了兼容，
  带 [TTS] 标记的回复不分段、语音与文字重复时只发一遍，不会再刷屏。
  合并后新增一块 WebUI 面板：能看到情绪随时间涨落的曲线、直接拖点改历史、
  设定此刻心情、冻结或重置情绪，也能看到 AI 到底抽取了哪些记忆并增删改，
  还能对分段参数做「试切预览」——只算不发，不用在群里试错。
  发送前还有一道「去 AI 味」阀门：本地词表给回复打分（AI 高频词、套路句型、句长过匀、
  破折号、四字格、项目符号、口语碎语不足、口癖重复），不达标就打回重写，越改越差会保留原版。
  主人鉴权与护栏：身份放系统级受信任位、身份支持平台限定、非主人的注入与冒充一律拦下；
  工具调用双向拦截默认只摘「会改东西 / 会执行 / 会删」的高危工具，
  搜索、查状态、记忆召回这类普通工具非主人照常能用。
  提示词全部可在面板上改（注入给模型的原话不再是硬编码），带预览、还原、导出导入。
  表达示例：从真实对话里学她以前怎么说话，先审后注入（可批准/拒绝/回滚）。
  傻瓜模式：默认只留必要页签，一页里就做两件事 —— 自检告诉你哪里没配好、一键套用推荐配置。
  还会自己回忆和记事（LLM 工具 recall_long_term_memory / memorize_long_term_memory）。
  隐私与合规：拒绝名单（既不采集也不注入）、/忘我 一键删掉自己的全部数据、档案导出。
  省 token：每轮都会变的内容（情绪、记忆、图库）贴在消息最后，
  前缀保持逐字节稳定，DeepSeek / OpenAI 的前缀缓存能一直命中。
  面板支持深色模式（默认跟随面板，右上角可切跟随/浅色/深色）；背景是 40 张图，每次打开随机一张（景深 + 毛玻璃卡片），右上角「背景」里可以换一张、并且拖滑杆调清晰度；窄屏页签横向滚动；
  面板分十三个页签：全部功能设置（配置直接在面板上改并回写）、情绪曲线、管理（批量维护）、
  长期记忆、记忆图谱（力导向的节点-关系图，关键词当桥自动聚簇，支持多选批量管理）、
  关键词配图、人格定制（含专属用户）、分段拟人、消息防抖（连发的几条攒成一轮再交给她，
  不会在你说完之前抢答；本地规则判断，判不准时默认放行）、去 AI 味、理论。
version: v2.9.0
author: 挽风随行+DSH(主代码编写)
