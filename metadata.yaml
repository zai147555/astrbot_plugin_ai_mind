name: astrbot_plugin_ai_mind
display_name: AI 心智 · 情绪与记忆
short_desc: 会波动的情绪 + 记得住人的记忆 + 拟人表达，外加分镜/刷站/画图等媒体能力
desc: >-
  给 AstrBot 里的 AI 一颗会波动的心、一份记得住人的记性、一张说得像人话的嘴。
  情绪：PAD 三维 + 40 种原型 + 词汇本体兜底，按真实时间衰减；身体层（昼夜节律/能量/饥饿/
  压力/疾病/生理周期）只给情绪一层偏移，不改人设；习惯化、共情、奖励预测误差三个仿人脑功能；
  日程按日期判上学/周末/法定假/寒暑假/调休，天数现算。记忆：分层 + 四力打分
  （BM25 相关/重要/新鲜/强度）+ 超图传播 + 遗忘曲线与间隔效应；用户说「不对」会触发价值回传，
  高价值同话题记忆会结晶成「经验」；知识树按会话激活、改件待审。表达：拟人分段、去 AI 味、
  表达示例先审后注入、模仿指定 QQ 的说话习惯；红线是不改身份/称呼/气泡数量/排版。
  媒体：视频分镜（编号宫格图 + 时间码 + 音频包络 + 缓存 + 逐格放大）、动图逐帧、
  刷 B 站（分区/关键词 → 字幕 → 打分 → 日报 + 分镜）、文生图（多平台适配层、尺寸自适应）、
  音频响度判词。工具：邮箱收发、开源插件市场自动检索、关键词配图、表情包库（按情绪补发）、群聊开关、
  群里发指令时大块结果自动投递到你私聊。护栏：主人鉴权放系统级受信任位、消息级拦截、
  工具闸门、发送前清理、危机信号优先。零第三方依赖（媒体能力可选依赖本机 ffmpeg），
  面板二十个页签，默认傻瓜模式；四条验证命令全绿（1189 条测试）。
version: v3.0.0
author: 挽风随行+DSH(主代码编写)
astrbot_version: ">=4.5,<5"
pages:
  - name: mind
    title: 心智面板
